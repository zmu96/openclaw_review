services:
  - type: web
    name: prism
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --mode both
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: CLONE_BASE_DIR
        value: /tmp/prism
      - key: REPORT_OUTPUT_DIR
        value: /tmp/reports
      # 아래 키들은 Render Dashboard > Environment 탭에서 직접 입력
      # - key: ANTHROPIC_API_KEY
      # - key: GEMINI_API_KEYS
      # - key: GROQ_API_KEY
      # - key: GITHUB_TOKEN
      # - key: DISCORD_BOT_TOKEN
